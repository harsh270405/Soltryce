<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soltryce — Starting up</title>
    <style>
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f7fb; color: #172033; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .box { text-align: center; padding: 3rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #65708a; font-size: 1.1rem; }
      .brand { font-weight: 800; font-size: 1.6rem; margin-bottom: 1.5rem; letter-spacing: -.04em; }
      @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      .spinner { width: 36px; height: 36px; border: 4px solid #e4e7f0; border-top-color: #4d5fd0; border-radius: 50%; animation: spin .8s linear infinite; margin: 1.5rem auto 0; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">📖 soltryce</div>
      <h1>Server is starting up</h1>
      <p>The backend is preparing — this usually takes less than a minute.<br>The page will load automatically once it's ready.</p>
      <div class="spinner"></div>
      <script>
        // Auto-reload once the backend comes back online
        (function check() {
          fetch('/api/v1/auth/me/', { credentials: 'same-origin' })
            .then(function(r) { if (r.ok || r.status === 401) location.reload(); else setTimeout(check, 3000); })
            .catch(function() { setTimeout(check, 3000); });
        })();
      </script>
    </div>
  </body>
</html>
